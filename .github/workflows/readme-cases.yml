name: Update README case table

# Runs when cases.json (or a case study file) changes on main, rebuilds the
# case table in README.md and commits it. Commits made with GITHUB_TOKEN do
# not start new workflow runs, so this cannot loop.
on:
  push:
    branches: [main]
    paths:
      - "cases.json"
      - "demos/**.md"
      - ".github/scripts/build_readme.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the case table
        run: python .github/scripts/build_readme.py

      - name: Commit README.md if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change to README.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README case table from cases.json"
          git push
